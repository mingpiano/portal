<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>琴房课程系统</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Spectral:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<style>
/* Layout: sticky studio bar → role-based tab row → one content column (max 1080px) with two-column panels that stack under 780px */
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#E8EAF0; --ink:#18202F; --ink-2:#565E71; --line:#D7DAE3;
  --accent:#84622A; --accent-ink:#FFFFFF; --accent-soft:#F3EADA;
  --pos:#2A64A3; --pos-soft:#E1ECF8; --neg:#B4521C; --neg-soft:#F8E6DA;
  --key-white:#FFFFFF; --key-black:#1C2333; --key-on:#D3AE68; --video-bg:#0B0E14;
  --shadow:0 1px 2px rgba(20,28,45,.05),0 6px 18px rgba(20,28,45,.06);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-work:"Spectral","Noto Serif SC",Georgia,serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#191E28; --surface-2:#232A37; --ink:#E8EBF1; --ink-2:#9CA4B6; --line:#2E3646;
  --accent:#D6AD62; --accent-ink:#1A1408; --accent-soft:#352C1B;
  --pos:#80B3EA; --pos-soft:#1B2A3D; --neg:#EC9A6A; --neg-soft:#3A2517;
  --key-white:#D9DCE4; --key-black:#0A0D13; --key-on:#D6AD62; --video-bg:#05070A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#191E28; --surface-2:#232A37; --ink:#E8EBF1; --ink-2:#9CA4B6; --line:#2E3646;
  --accent:#D6AD62; --accent-ink:#1A1408; --accent-soft:#352C1B;
  --pos:#80B3EA; --pos-soft:#1B2A3D; --neg:#EC9A6A; --neg-soft:#3A2517;
  --key-white:#D9DCE4; --key-black:#0A0D13; --key-on:#D6AD62; --video-bg:#05070A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.25rem} h3{font-size:1.02rem}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.work{font-family:var(--f-work);font-style:italic;font-weight:500}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.25rem}
.brand span{font-family:var(--f-work);font-style:italic;color:var(--ink-2)}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
.who select{width:auto;padding:4px 8px;font-size:.85rem}
.lang{min-width:52px;justify-content:center;font-family:var(--f-body);letter-spacing:.04em}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;border-bottom:2px solid transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:500}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.demo-note{background:var(--accent-soft);color:var(--ink);font-size:.82rem}
.demo-note .wrap{padding-block:6px}

main{padding-block:22px 64px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid-side{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:780px){.grid2,.grid-side{grid-template-columns:1fr}}
.grid2>*,.grid-side>*{min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:1.6rem}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;font-family:var(--f-work);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-2)}
.stat.flag b{color:var(--neg)}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:150px}
.when{min-width:96px;font-variant-numeric:tabular-nums}
.when b{display:block;font-size:.95rem}
.when span{font-size:.8rem;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent;font-weight:500}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--surface-2);color:var(--ink-2)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;color:var(--ink)}
.pts{font-variant-numeric:tabular-nums;font-weight:700}
.pts.pos{color:var(--pos)} .pts.neg{color:var(--neg)}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink-2);font-size:.8rem;border-top:0}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}

/* keyboard */
.kb{width:100%;max-width:300px;height:auto;display:block}
.kb .wk{fill:var(--key-white);stroke:var(--line);stroke-width:1}
.kb .wk.on{fill:var(--key-on)}
.kb .bk{fill:var(--key-black)}
.kb .kn{fill:var(--ink-2);font-size:9px;text-anchor:middle;font-family:var(--f-body)}
.kb .kn.on{fill:#1C2333}

/* lesson record */
.lesson{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson .no{font-family:var(--f-work);font-size:1.6rem;font-weight:600;line-height:1;color:var(--accent)}
.lesson .no small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--ink-2);margin-top:6px;font-weight:400}
.lesson>div{min-width:0}
.pieces{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
.piece{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.mt{font-size:.72rem;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}

/* next lesson hero */
.next{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.date-block{border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;min-width:88px;background:var(--bg)}
.date-block .m{font-size:.8rem;color:var(--ink-2)}
.date-block .d{font-family:var(--f-work);font-size:2.2rem;font-weight:600;line-height:1.1}
.date-block .w{font-size:.82rem}

/* portfolio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pf .card{padding:0;overflow:hidden;gap:0}
.thumb{aspect-ratio:16/10;background:var(--surface-2);position:relative;max-width:100%}
.thumb svg{width:100%;height:100%;display:block}
.thumb .staff line{stroke:var(--line);stroke-width:1.2}
.thumb .staff .nh{fill:var(--ink-2)}
.thumb .play{position:absolute;right:10px;bottom:10px;background:var(--surface);border-radius:99px;padding:2px 10px;font-size:.78rem}
.thumb video{width:100%;height:100%;object-fit:cover;display:block;background:var(--video-bg)}
.pf .meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2);min-width:0}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input[type=number]{width:76px;text-align:right}

.rule{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}

/* steps */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;position:relative}
.step::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:var(--f-work)}
.step::after{content:"";position:absolute;left:12.5px;top:40px;bottom:-6px;width:1px;background:var(--line)}
.step:last-child::after{display:none}
.step b{display:block}

/* email mock */
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mail-h{background:var(--surface-2);padding:10px 14px;font-size:.82rem;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.mail-h span{color:var(--ink-2)}
.mail-h b{min-width:0;overflow-wrap:anywhere}
.mail-b{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
pre.ics{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.78rem;overflow-x:auto;margin:0;line-height:1.45}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .card{max-width:460px;width:100%;gap:16px}
.login-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.pick:hover{border-color:var(--accent)}
.pick .grow{flex:1;min-width:0}
.code-input{font-family:var(--f-work);font-size:1.7rem;font-weight:600;letter-spacing:.45em;text-align:center;padding:10px 6px 10px calc(6px + .45em)!important;font-variant-numeric:tabular-nums}
.code-show{font-family:var(--f-work);font-size:1.7rem;font-weight:600;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink)}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.err{color:var(--neg);font-size:.85rem}
.divider{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink-2);letter-spacing:.04em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:640px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.callout{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:.9rem}
.big-pts{font-family:var(--f-work);font-size:2.6rem;font-weight:600;line-height:1}

/* accompaniment library */
.trk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trk:first-child{border-top:0}
.trk>div{min-width:0}
.playbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--accent);flex:none;padding:0}
.playbtn:hover{border-color:var(--accent)}
.playbtn svg{width:12px;height:12px;fill:currentColor}
[data-act="play"] .ic-stop{display:none}
[data-act="play"][aria-pressed="true"] .ic-stop{display:block}
[data-act="play"][aria-pressed="true"] .ic-play{display:none}
.playbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.acc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 3px;font-size:.8rem;background:var(--bg);cursor:pointer;color:var(--ink)}
.acc-chip:hover{border-color:var(--accent)}
.acc-chip .dot{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.acc-chip .dot svg{width:8px;height:8px;fill:currentColor}
.acc-chip[aria-pressed="true"] .dot{background:var(--accent);color:var(--accent-ink)}
.matrix th,.matrix td{text-align:center;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.mx-on{color:var(--pos);font-weight:700}
.mx-hw{color:var(--accent);font-size:.8rem}
.mx-off{color:var(--ink-2)}
.picklist{display:flex;flex-direction:column;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:4px 10px 8px;background:var(--bg)}
.picklist label{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink);padding:3px 0;cursor:pointer}
.picklist input{accent-color:var(--accent)}
.picklist .grp{font-size:.75rem;color:var(--ink-2);margin-top:8px;letter-spacing:.04em}
.col-pick{flex-direction:column;align-items:flex-start;gap:2px}
.col-pick .small{line-height:1.4}
.path{font-size:.8rem;color:var(--ink-2)}
.path b{color:var(--ink);font-weight:500}
.opt-row{display:flex;flex-direction:column;gap:8px}
.opt-row>span{font-size:.85rem;color:var(--ink-2)}

/* video submission */
.up-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.up-opts{grid-template-columns:1fr}}
.up-opt{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-width:0}
.up-opt .ic{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.up-opt .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.up-opt label.btn{align-self:flex-start}
.preview video{width:100%;max-height:320px;background:var(--video-bg);border-radius:8px;display:block}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s linear}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--neg);display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:reduce){#toast,.prog>i{transition:none}.rec-dot{animation:none}}

/* ===== v4：背景主题、头像、通知、日历、资源、庆祝 ===== */
#bg{position:fixed;inset:0;z-index:-1;background:var(--bg);overflow:hidden}
#bg::before{content:"";position:absolute;inset:0;background-image:var(--tile);background-repeat:repeat;opacity:.13;filter:saturate(.6)}
#bg[data-kid="1"]::before{opacity:.9;filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #bg::after{content:"";position:absolute;inset:0;background:rgba(12,15,22,.68)}}
:root[data-theme="dark"] #bg::after{content:"";position:absolute;inset:0;background:rgba(12,15,22,.68)}
.page-h{background:color-mix(in srgb,var(--surface) 84%,transparent);padding:10px 16px;border-radius:12px;border:1px solid var(--line)}
main .stack>p.small,main .stack>p.muted{background:color-mix(in srgb,var(--surface) 84%,transparent);padding:8px 12px;border-radius:10px}
.fest{display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-size:1.05rem}
.fest-ic{font-size:1.5rem;line-height:1}

.av{overflow:hidden;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avbtn{border:2px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer;display:inline-flex}
.avbtn:hover{border-color:var(--accent)}
.logo{height:34px;width:auto;max-width:150px;display:block;object-fit:contain}
.logo-ph{display:inline-flex;align-items:center;gap:8px}
.logo-ph svg{width:34px;height:34px;flex:none}
.brand{align-items:center}
.brand-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--neg);color:var(--accent-ink);font-size:.7rem;margin-left:6px;font-variant-numeric:tabular-nums;font-weight:700}
.demo-note .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-note select{width:auto;padding:2px 8px;font-size:.8rem}
.viewing{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

const tileCache={};
function tileUri(em,kid){
  const key=em.join('')+kid;if(tileCache[key])return tileCache[key];
  const size=kid?280:340,fs=kid?46:34,n=kid?9:6;let t='';
  for(let i=0;i<n;i++){const x=((i*97+23)%(size-60))+10,y=((i*61+37)%(size-50))+fs,r=((i*37)%50)-25;
    t+=`<text x="${x}" y="${y}" transform="rotate(${r} ${x} ${y})">${em[i%em.length]}</text>`}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><g font-size="${fs}" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">${t}</g></svg>`;
  return tileCache[key]='data:image/svg+xml,'+encodeURIComponent(svg);
}
function applyTheme(){
  const bg=document.getElementById('bg');if(!bg)return;

  const s=state.role==='student'?stu(state.sid):null,kid=!!(s&&s.kind==='child');
  let g,em;
  if(occ){const v=FEST[occ][kid?'kid':'ad'];g=v.g;em=v.e}
  else{g=SEAS[se][kid?'kid':'ad'];em=kid?[...STYLES[styleOf(s)].e,...SEAS[se].e.slice(0,2)]:SEAS[se].e}
  bg.style.background=`linear-gradient(160deg,${g[0]},${g[1]})`;
  bg.style.setProperty('--tile',`url("${tileUri(em,kid)}")`);
  bg.dataset.kid=kid?'1':'0';
}

/* 生日、周年 */
function celebrations(sid){
  const s=stu(sid),t=today(),out=[];
  if(s.birth&&sameMD(pymd(s.birth),t))out.push({k:'birthday',age:ageOf(s)});
  if(s.start){const st=pymd(s.start),y=t.getFullYear()-st.getFullYear();if(y>=1&&sameMD(st,t))out.push({k:'anniv',years:y})}
  return out;
}
function upcomingCelebs(){
  const t=today(),out=[];
  state.students.forEach(s=>{
    [['birthday',s.birth],['anniv',s.start]].forEach(([k,ds])=>{
      if(!ds)return;const d=nextOcc(ds,t),diff=dayDiff(d,t);if(diff>7)return;
      const years=d.getFullYear()-pymd(ds).getFullYear();if(k==='anniv'&&years<1)return;
      const les=lessonsOf(s.id).filter(l=>l.status==='scheduled').find(l=>Math.abs(dayDiff(l.date,d))<=3);
      out.push({s,k,d,diff,years,les});
    });
  });
  return out.sort((a,b)=>a.diff-b.diff);
}
function maybeCelebrate(){
  if(state.role!=='student')return;
  const c=celebrations(state.sid)[0];if(!c)return;
  const key=state.sid+c.k+ymd(today());if(state.shown[key])return;
  state.shown[key]=1;openModal(()=>modalCelebrate(c,state.sid));
}

/* 正在学习：从每节课的曲目记录里归纳 */
function learning(sid){
  const m=new Map();
  lessonsOf(sid).filter(l=>l.status==='done'&&l.notes).sort((a,b)=>a.date-b.date).forEach(l=>l.notes.p.forEach(p=>{
    const k=JSON.stringify(p[0]);const e=m.get(k)||{first:l.date,n:0};e.p=p;e.last=l.date;e.n++;e.st=p[2];m.set(k,e)}));
  const all=[...m.values()];
  return {cur:all.filter(e=>e.st!=='done').sort((a,b)=>b.last-a.last),past:all.filter(e=>e.st==='done').sort((a,b)=>b.last-a.last)};
}

  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    img.onload=()=>{const c=document.createElement('canvas');c.width=WS.W*2;c.height=wsH()*2;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/png')};img.onerror=rej;img.src=u});
}

function lastWeekday(wd,h,m){const d=new Date(now);d.setHours(h,m,0,0);d.setDate(d.getDate()-((d.getDay()-wd+7)%7));if(d>now)d.setDate(d.getDate()-7);return d}

function seed(){
  const students=STUDENT_CFG.map(c=>({id:c.id,name:c.name,email:c.email,contact:c.contact,cal:c.cal,lang:c.lang,level:c.level,group:c.group,paid:c.paid,wd:c.wd,h:c.h,m:c.m,dur:c.dur,...extraOf(c)}));
  const lessons=[],assigns=[];
  STUDENT_CFG.forEach((c,si)=>{
    const last=lastWeekday(c.wd,c.h,c.m);
    for(let i=1;i<=c.done;i++){
      const date=new Date(last.getTime()-(c.done-i)*7*DAY);
      const k=(i*7+si*3)%11;
      const L0=c.notes.length;const note=c.notes[(((L0-1-(c.done-i))%L0)+L0)%L0];
      const id=`${c.id}-${i}`,isLast=i===c.done;
      lessons.push({id,sid:c.id,n:i,date:+date,dur:c.dur,status:'done',
        confirmedAt:k===5?null:+date-(26+k)*HOUR,
        signedAt:(isLast&&c.id==='lucas')?null:+date+(2+k)*HOUR,
        notes:note});
      const due=new Date(date);due.setDate(due.getDate()+6);due.setHours(20,0,0,0);
      const forceOpen=c.id==='lucas'&&i===c.done-1;
      let sub=null;
      if(due>now||forceOpen)sub=null;
      else if(k===3)sub=+due+DAY-3*HOUR;
      else if(k===7)sub=null;
      else sub=+due-((k%4)+1)*DAY+2*HOUR;
      const feat=note.p.some(p=>p[2]==='done');
      const t0=note.p[0][0],t0en=Array.isArray(t0)?t0[1]:t0;
      assigns.push({id:'a-'+id,lid:id,sid:c.id,title:note.hw,piece:note.p[0],due:+due,submittedAt:sub,featured:feat,acc:[],accDays:7,
        yt:sub?'ok':null,
        video:sub?{name:`${t0en}.mov`,dur:`${1+(k%3)}:${pad((k*13)%60)}`,url:null}:null});
    }
    const nx=new Date(last);nx.setDate(nx.getDate()+7);
    lessons.push({id:`${c.id}-${c.done+1}`,sid:c.id,n:c.done+1,date:+nx,dur:c.dur,status:'scheduled',confirmedAt:c.pre?+now-5*HOUR:null,signedAt:null,notes:null,remindedAt:c.pre?+now-30*HOUR:null});
  });
  /* 示例：作业里附带的伴奏 */
  const latest=sid=>assigns.filter(a=>a.sid===sid).sort((a,b)=>b.due-a.due)[0];
  [['emma',['t9']],['lucas',['t9','t10']],['mia',['t6']]].forEach(([sid,ids])=>{const a=latest(sid);if(a){a.acc=ids;a.accDays=7}});
  const zOld=assigns.filter(a=>a.sid==='zihan'&&a.piece[2]!=='done'&&a.due<now-10*DAY).sort((a,b)=>b.due-a.due)[0];
  if(zOld){zOld.acc=['t11'];zOld.accDays=7}
  const zSub=assigns.filter(a=>a.sid==='zihan'&&a.submittedAt).sort((a,b)=>b.submittedAt-a.submittedAt)[0];
  if(zSub)zSub.yt='failed';
  return {students,lessons,assigns,library:seedLibrary(),...seedExtra()};
}

function hwStatus(a){
  if(a.submittedAt){return a.submittedAt<=a.due?{k:'ok',t:L('按时提交','On time')}:{k:'bad',t:L(`迟交 ${Math.ceil((a.submittedAt-a.due)/DAY)} 天`,`${days(Math.ceil((a.submittedAt-a.due)/DAY))} late`)}}
  if(now<a.due)return {k:'wait',t:L(`${rel(a.due)}截止`,`Due ${rel(a.due)}`)};
  const over=Math.ceil((now-a.due)/DAY);
  if(over>state.rules.grace)return {k:'bad',t:L('未交','Missing')};
  return {k:'bad',t:L(`已逾期 ${over} 天`,`${days(over)} overdue`)};
}

function ledger(sid){
  const R=state.rules,out=[];
  lessonsOf(sid).forEach(l=>{
    if(l.confirmedAt)out.push({d:l.confirmedAt,label:L(`确认上课 · ${fmtD(l.date)}`,`Confirmed lesson · ${fmtD(l.date)}`),pts:R.confirm});
    if(l.signedAt)out.push({d:l.signedAt,label:L(`课后签字 · 第 ${l.n} 节`,`Signed lesson ${l.n}`),pts:R.sign});
    if(l.status==='noshow')out.push({d:l.date,label:L(`缺课未请假 · ${fmtD(l.date)}`,`No-show · ${fmtD(l.date)}`),pts:R.noshow});
  });
  let streak=0;
  state.assigns.filter(a=>a.sid===sid).sort((a,b)=>a.due-b.due).forEach(a=>{
    const p=pieceName(a);
    if(a.submittedAt){
      if(a.submittedAt<=a.due){streak++;out.push({d:a.submittedAt,label:L(`按时交作业 · ${p}`,`Homework on time · ${p}`),pts:R.ontime});
        if(R.streakN>0&&streak%R.streakN===0)out.push({d:a.submittedAt+1,label:L(`连续 ${streak} 次按时交作业`,`${streak} on time in a row`),pts:R.streakBonus});}
      else{streak=0;out.push({d:a.submittedAt,label:L(`作业迟交 · ${p}`,`Homework late · ${p}`),pts:R.late})}
    }else if(now-a.due>R.grace*DAY){streak=0;out.push({d:a.due+R.grace*DAY,label:L(`作业未交 · ${p}`,`Homework missing · ${p}`),pts:R.missing})}
  });
  return out.sort((a,b)=>b.d-a.d);
}

/* 示例音频：浏览器里合成几小节伴奏型，代替真实的 mp3 */
let actx=null,playing=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function updatePlayButtons(){document.querySelectorAll('[data-act="play"]').forEach(b=>b.setAttribute('aria-pressed',playing&&playing.tid===b.dataset.tid?'true':'false'))}
function stopPlay(){if(!playing)return;clearTimeout(playing.timer);playing.nodes.forEach(n=>{try{n.stop()}catch(_){}});playing=null;updatePlayButtons()}
function playTrack(tid){
  if(playing&&playing.tid===tid){stopPlay();return}
  stopPlay();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(_){toast(L('这个浏览器不能播放示例音频','This browser cannot play the sample audio'));return}
  const t=trk(tid),beat=60/t.bpm,meter=t.meter;
  const prog=[[48,[60,64,67]],[41,[60,65,69]],[43,[59,62,67]],[48,[60,64,67]]];
  const bars=Math.max(2,Math.min(8,Math.floor(12/(meter*beat))));
  const t0=actx.currentTime+0.06,nodes=[];
  const note=(m,at,len,vol)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=mtof(m);
    g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.015);g.gain.exponentialRampToValueAtTime(0.0001,at+len);
    o.connect(g).connect(actx.destination);o.start(at);o.stop(at+len+0.05);nodes.push(o)};
  for(let b=0;b<bars;b++){const [bass,ch]=prog[b%4];
    for(let i=0;i<meter;i++){const at=t0+(b*meter+i)*beat;
      if(i===0||(meter===6&&i===3))note(bass,at,beat*1.6,0.32);
      else ch.forEach(m=>note(m,at,beat*0.7,0.09));}}
  const dur=bars*meter*beat;
  playing={tid,nodes,timer:setTimeout(()=>{playing=null;updatePlayButtons()},(dur+0.3)*1000)};
  updatePlayButtons();
  toast(L(`示例：${nm(t.title)}（${nm(t.ver)}）· 真实版播放老师上传的 mp3`,`Sample: ${nm(t.title)} (${nm(t.ver)}) · the real site plays the teacher's mp3`));
}

  const head=`<div class="login-h"><div style="display:flex;gap:12px;align-items:center">${logoHtml()}<div><h1 style="font-size:1.7rem">${L('琴房','Piano Studio')}</h1><p class="muted"><span class="work">${L('Piano Studio','琴房')}</span> · ${L('课程管理演示版','lesson manager demo')}</p></div></div>${langBtn()}</div>`;
  let body='';
  if(A.step==='email'){
    body=`<form class="stack" id="login-email-form" style="gap:12px" novalidate>
      <p class="small">${L('输入你的邮箱，我们会发一个 6 位验证码。不需要 Google 账号，任何邮箱都可以。','Enter your email and we\'ll send a 6-digit code. No Google account needed; any email works.')}</p>
      <label class="f">${L('邮箱','Email')}<input type="email" id="login-email" value="${esc(A.email)}" placeholder="you@example.com" autocomplete="email"></label>
      ${A.err?`<p class="err" role="alert">${esc(A.err)}</p>`:''}
      <div class="btns"><button class="btn primary" type="submit">${L('发送验证码','Send code')}</button></div>
    </form>
    <div class="divider">${L('演示用邮箱，点一下填入','Demo emails · tap to fill in')}</div>
    <div class="chips">${DEMO_EMAILS.map(([e,n])=>`<button class="chip" data-act="fill-email" data-email="${e}">${esc(nm(n))}</button>`).join('')}</div>`;
  }else if(A.step==='code'){
    body=`<p class="small">${L(`验证码已发到 <b>${esc(A.email)}</b>，10 分钟内有效，用一次就作废。`,`Code sent to <b>${esc(A.email)}</b>. It works for 10 minutes and only once.`)}</p>
    <details open><summary class="small muted" style="cursor:pointer">${L('演示：这封邮件本来会发到你的邮箱','Demo: this email would arrive in your inbox')}</summary><div style="margin-top:8px">
    ${mailMock(A.email,L(`琴房登录验证码：${A.code}`,`Piano Studio sign-in code: ${A.code}`),`<p>${L('你的登录验证码是','Your sign-in code is')}</p><p class="code-show">${A.code}</p><p class="small muted">${L('如果不是你本人在登录，忽略这封邮件就行。','If you didn\'t try to sign in, you can ignore this email.')}</p>`)}</div></details>
    <form class="stack" id="login-code-form" style="gap:12px" novalidate>
      <label class="f">${L('6 位验证码','6-digit code')}<input type="text" id="login-code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></label>
      <label class="check"><input type="checkbox" id="login-remember" ${A.remember?'checked':''}>${L('在这台设备上记住我 90 天','Remember me on this device for 90 days')}</label>
      ${A.err?`<p class="err" role="alert">${esc(A.err)}</p>`:''}
      <div class="btns"><button class="btn primary" type="submit">${L('登录','Sign in')}</button><button class="btn" type="button" data-act="auth-resend">${L('重新发送','Resend')}</button><button class="btn link small" type="button" data-act="auth-back">${L('换个邮箱','Use another email')}</button></div>
    </form>`;
  }else{
    body=`<p class="small">${L(`<b>${esc(A.email)}</b> 对应 ${A.matches.length} 个账户，选一个进入。`,`<b>${esc(A.email)}</b> matches ${A.matches.length} accounts. Pick one to continue.`)}</p>
    ${A.matches.map(x=>{const [t,sub,o]=matchLabel(x);return `<button class="pick" data-act="login" data-r="${x.r}" data-id="${x.id||''}">${avatar(o)}<div class="grow"><b>${esc(t)}</b><div class="small muted">${esc(sub)}</div></div></button>`}).join('')}
    <button class="btn link small" data-act="auth-back">${L('换个邮箱','Use another email')}</button>`;
  }
  return `<div class="wrap login"><div class="card">${head}${body}</div></div>`;
}

      <div class="brand">${logoHtml()}<div class="brand-t"><b>${L('琴房','Piano Studio')}</b><span>${L('Piano Studio','琴房')}</span></div></div>

    </div>
    <div class="wrap"><nav class="tabs" aria-label="${L('页面','Pages')}">${tabs.map(([k,t])=>`<button class="tab" data-act="tab" data-tab="${k}" ${state.tab===k?'aria-current="page"':''}>${nm(t)}${tabBadge(k)}</button>`).join('')}</nav></div>
  </header>
  <div class="demo-note"><div class="wrap"><span>${L('演示版：数据都是示例，不会真的发邮件、改日历或上传文件。','Demo: all data is sample data. Nothing is emailed, added to a calendar or uploaded.')} <button class="btn link small" data-act="reset">${L('恢复示例数据','Reset sample data')}</button></span>

/* ---------- 老师：总览 ---------- */
function adminOverview(){
  const weekEnd=now.getTime()+7*DAY;
  const upcoming=state.lessons.filter(l=>l.status==='scheduled'&&l.date<weekEnd).sort((a,b)=>a.date-b.date);
  const unconfirmed=upcoming.filter(l=>!l.confirmedAt);
  const unsigned=state.lessons.filter(l=>l.status==='done'&&!l.signedAt);
  const dueT=state.students.filter(s=>tuition(s).due);
  const overdue=state.assigns.filter(a=>!a.submittedAt&&now>a.due&&now-a.due<=state.rules.grace*DAY);
  const av=s=>avatar(s);
  const msgU=state.messages.filter(m=>m.from!=='teacher'&&!m.readT);
  const todo=[
    ...[...new Set(msgU.map(m=>m.sid))].map(sid=>{const s=stu(sid),last=msgU.filter(m=>m.sid===sid).slice(-1)[0];return `<div class="row">${av(s)}<div class="grow"><b>${esc(s.name)}</b> ${L('留言了','sent a message')}<div class="small muted">${esc(tx(last.text))}</div></div><span class="pill wait">${L('待回复','Needs reply')}</span><button class="btn sm" data-act="reply-go" data-sid="${sid}">${L('去回复','Reply')}</button></div>`}),
    ...dueT.map(s=>{const t=tuition(s),pp=payerOf(s);return `<div class="row">${av(s)}<div class="grow"><b>${esc(s.name)}</b> ${L('本期 10 节已上完','used all 10 lessons this term')}<div class="small muted">${L(`共上 ${t.done} 节 · 已付 ${s.paid*10} 节 · 提醒发给：${pp===s?'本人':nm(pp.name)}`,`${t.done} lessons taken · ${s.paid*10} paid · reminder goes to: ${pp===s?'the student':nm(pp.name)}`)}</div></div>${s.claimed?`<span class="pill ok">${L('家长说已付款','Parent says paid')}</span>`:`<span class="pill bad">${L('学费待交','Tuition due')}</span>`}<div class="btns"><button class="btn sm" data-act="tuition-mail" data-sid="${s.id}">${L('发学费提醒','Send reminder')}</button><button class="btn sm" data-act="paid" data-sid="${s.id}">${L('记录已收款','Mark paid')}</button></div></div>`}),
    ...unconfirmed.map(l=>{const s=stu(l.sid);return `<div class="row">${av(s)}<div class="grow"><b>${esc(s.name)}</b> ${L(`还没确认 ${fmtD(l.date)} 的课`,`hasn't confirmed ${fmtD(l.date)}`)}<div class="small muted">${l.remindedAt?L('上次提醒 ','Last reminded ')+fmtDT(l.remindedAt):L('还没发过提醒','No reminder sent yet')}</div></div><span class="pill wait">${L('待确认','Unconfirmed')}</span><button class="btn sm" data-act="remind" data-lid="${l.id}">${L('发提醒','Remind')}</button></div>`}),
    ...unsigned.map(l=>{const s=stu(l.sid);return `<div class="row">${av(s)}<div class="grow"><b>${esc(s.name)}</b> ${L(`第 ${l.n} 节记录待签字`,`lesson ${l.n} not signed yet`)}<div class="small muted">${L(`${fmtD(l.date)} 上课 · 48 小时后自动确认`,`Lesson on ${fmtD(l.date)} · auto-confirms after 48 hours`)}</div></div><span class="pill wait">${L('待签字','Unsigned')}</span></div>`}),
    ...overdue.map(a=>{const s=stu(a.sid);const st=hwStatus(a);return `<div class="row">${av(s)}<div class="grow"><b>${esc(s.name)}</b> ${L('作业没交','homework not in')}<div class="small muted">${esc(tx(a.title))}</div></div><span class="pill bad">${st.t}</span></div>`}),
    ...state.assigns.filter(a=>a.yt==='failed').map(a=>{const s=stu(a.sid);return `<div class="row">${av(s)}<div class="grow"><b>${esc(s.name)}</b> ${L('的视频没能转存到 YouTube','— video didn\'t transfer to YouTube')}<div class="small muted">${esc(pieceName(a))} · ${L('上传中断，已自动重试 3 次。Drive 原件还在，不会被清理。','Upload interrupted; retried 3 times. The Drive original is kept and won\'t be cleaned up.')}</div></div><span class="pill bad">${L('转存失败','Transfer failed')}</span><button class="btn sm" data-act="yt-retry" data-aid="${a.id}">${L('重试','Retry')}</button></div>`})
  ];
  const cel=upcomingCelebs();
  const celRows=cel.map(c=>{
    const when=c.diff===0?L('今天','today'):c.diff===1?L('明天','tomorrow'):L(`${c.diff} 天后（${fmtD(c.d)}）`,`in ${c.diff} days (${fmtD(c.d)})`);
    const what=c.k==='birthday'?L(`${c.years} 岁生日`,`${c.years}th birthday`):L(`学琴 ${c.years} 周年`,`${c.years}-year piano anniversary`);
    const les=c.les?(dayDiff(c.les.date,c.d)===0?L(`正好是上课那天（${fmtT(c.les.date)}）`,`falls on a lesson day (${fmtT(c.les.date)})`):L(`${fmtD(c.les.date)} 有课，离这一天 ${Math.abs(dayDiff(c.les.date,c.d))} 天`,`lesson on ${fmtD(c.les.date)}, ${Math.abs(dayDiff(c.les.date,c.d))} days from it`)):'';
    return `<div class="row">${avatar(c.s)}<div class="grow"><b>${esc(c.s.name)}</b> ${what}<div class="small muted">${when}</div>${les?`<div class="small"><span class="pill wait">${L('上课提醒','Lesson heads-up')}</span> ${les}</div>`:''}</div><span class="pill ${c.k==='birthday'?'ok':'plain'}">${c.k==='birthday'?'🎂':'🎹'}</span></div>`}).join('');
  return `<div class="stack">
    <div class="page-h"><h1>${L('总览','Overview')}</h1><span class="muted">${fmtD(now)}</span></div>
    ${festBanner()}
    <div class="stats">
      <div class="stat"><b>${upcoming.length}</b><span>${L('未来 7 天的课','Lessons in the next 7 days')}</span></div>
      <div class="stat ${unconfirmed.length?'flag':''}"><b>${unconfirmed.length}</b><span>${L('学生还没确认','Not confirmed yet')}</span></div>
      <div class="stat ${msgU.length?'flag':''}"><b>${msgU.length}</b><span>${L('条留言待回复','Messages to answer')}</span></div>
      <div class="stat ${dueT.length?'flag':''}"><b>${dueT.length}</b><span>${L('学费待交','Tuition due')}</span></div>
    </div>
    <div class="grid2">
      <section class="card"><div class="card-h"><h2>${L('接下来的课','Upcoming lessons')}</h2><button class="btn sm" data-act="tab" data-tab="calendar">${L('打开日历','Open calendar')}</button></div>
        <div class="rows">${upcoming.map(l=>{const s=stu(l.sid);return `<div class="row"><div class="when"><b>${rel(l.date)} ${fmtT(l.date)}</b><span>${fmtD(l.date)}</span></div><div class="grow"><b>${esc(s.name)}</b><div class="small muted">${L(`第 ${l.n} 节 · ${l.dur} 分钟`,`Lesson ${l.n} · ${l.dur} min`)} · ${calLabel(s.cal)}</div></div>${l.confirmedAt?`<span class="pill ok">✓ ${L('已确认','Confirmed')}</span>`:`<span class="pill wait">${L('待确认','Unconfirmed')}</span>`}</div>`}).join('')||`<p class="muted">${L('未来 7 天没有课。','No lessons in the next 7 days.')}</p>`}</div>
      </section>
      <section class="card"><div class="card-h"><h2>${L('需要处理','To do')}</h2><span class="small muted">${L(`${todo.length} 件`,`${todo.length} items`)}</span></div><div class="rows">${todo.join('')||`<p class="muted">${L('都处理完了。','All done.')}</p>`}</div></section>
    </div>
    <section class="card"><div class="card-h"><h2>${L('生日和周年纪念日','Birthdays and anniversaries')}</h2><span class="small muted">${L('未来 7 天；生日当天学生登录会看到庆祝动画','Next 7 days; students see a celebration when they sign in that day')}</span></div><div class="rows">${celRows||`<p class="muted">${L('未来 7 天没有。','None in the next 7 days.')}</p>`}</div></section>
    <section class="card"><div class="card-h"><h2>${L('积分榜','Leaderboard')}</h2><button class="btn sm" data-act="tab" data-tab="points">${L('调整规则','Edit rules')}</button></div>${leaderboard()}</section>
  </div>`;
}
function leaderboard(){
  const rows=state.students.filter(s=>showPts(s.id)).map(s=>({s,t:total(s.id),l:ledger(s.id)})).sort((a,b)=>b.t-a.t);
  const off=state.students.filter(s=>!showPts(s.id));
  return `<div class="tbl"><table><thead><tr><th>${L('学生','Student')}</th><th class="r">${L('总积分','Points')}</th><th>${L('最近一条','Latest')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.s.name)}</b></td><td class="r pts num">${r.t}</td><td class="small">${r.l[0]?`${esc(r.l[0].label)} <span class="pts ${r.l[0].pts>=0?'pos':'neg'}">${signed(r.l[0].pts)}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div>${off.length?`<p class="small muted">${L(`没有显示积分的学生：${off.map(s=>esc(s.name)).join('、')}`,`Points hidden for: ${off.map(s=>esc(s.name)).join(', ')}`)}</p>`:''}`;
}

  <div class="grid-side">
    <section class="card" style="padding:8px">${state.students.map(x=>{const t=tuition(x);return `<button class="pick" style="border:0;background:${x.id===s.id?'var(--surface-2)':'transparent'}" data-act="sel" data-sid="${x.id}">${avatar(x)}<div class="grow"><b>${esc(x.name)}</b><div class="small muted num">${showPts(x.id)?L(`${t.used}/10 节 · ${total(x.id)} 分`,`${t.used}/10 lessons · ${total(x.id)} pts`):L(`${t.used}/10 节`,`${t.used}/10 lessons`)}</div></div>${t.due?`<span class="pill bad">${L('学费','Tuition')}</span>`:''}</button>`}).join('')}</section>

function studentDetail(s){

    <section class="card"><div class="card-h"><div style="display:flex;gap:12px;align-items:center">${avatar(s,48)}<div><h2>${esc(s.name)}</h2><p class="small muted">${esc(nm(s.level))} · ${s.kind==='adult'?L('成人','Adult'):L('儿童','Child')}${age!=null?` · ${L(`${age} 岁`,`age ${age}`)}`:''} · ${esc(mailTo(s)||'—')}</p></div></div><span class="pill plain">${calLabel(s.cal)}</span></div>

        <div><p class="small muted">${L('本期学费进度（每 10 节一期）','Tuition progress (10 lessons per term)')}</p>${keyboard(t.used)}<p class="small num" style="margin-top:6px">${t.due?`<span class="pill bad">${L('已上满，待交下一期','Term used up · next term due')}</span>`:L(`还剩 ${t.left} 节`,`${t.left} lessons left`)}</p></div>
        <div class="stack" style="gap:6px"><p class="small muted">${showPts(s.id)?L('总积分','Total points'):L('积分','Points')}</p>${showPts(s.id)?`<div class="big-pts num">${total(s.id)}</div>`:`<p class="muted">${L('已对该学生隐藏','Hidden for this student')}</p>`}<p class="small muted">${L('下节课：','Next lesson: ')}${nx?`${fmtDT(nx.date)} ${nx.confirmedAt?`<span class="pill ok">${L('已确认','Confirmed')}</span>`:`<span class="pill wait">${L('待确认','Unconfirmed')}</span>`}`:L('未排','not scheduled')}</p>
        <div class="btns">${nx?`<button class="btn sm" data-act="cal-open" data-lid="${nx.id}">${L('调整时间','Change time')}</button>`:''}${nx&&!nx.confirmedAt?`<button class="btn sm" data-act="remind" data-lid="${nx.id}">${L('发上课提醒','Send lesson reminder')}</button>`:''}${t.due?`<button class="btn sm" data-act="tuition-mail" data-sid="${s.id}">${L('发学费提醒','Send tuition reminder')}</button><button class="btn sm" data-act="paid" data-sid="${s.id}">${L('记录已收款','Mark paid')}</button>`:''}</div></div>
      </div>
      <p class="small muted">${L('分组','Group')}：${esc(groupName(s.group))} · ${L('邮件语言','Email language')}：${langLabel(s.lang)}</p>
    </section>

    <section class="card"><div class="card-h"><h3>${L('账户和个人信息','Account and profile')}</h3><span class="small muted">${L('只有你和家长看得到生日','Only you and the family see the birthday')}</span></div>
      <div class="form">
        <label class="f">${L('学生类型（决定界面风格）','Type (decides the look)')}<select id="sf-kind" data-sf="kind"><option value="child" ${s.kind==='child'?'selected':''}>${L('儿童：卡通背景','Child: cartoon backgrounds')}</option><option value="adult" ${s.kind==='adult'?'selected':''}>${L('成人：淡雅背景','Adult: calm backgrounds')}</option></select></label>
        <label class="f">${L('生日','Birthday')}<input type="date" id="sf-birth" data-sf="birth" value="${s.birth||''}"></label>

/* ---------- 老师：日历 ---------- */
function adminCalendar(){
  const ws=new Date(state.calWeek),we=new Date(ws.getTime()+7*DAY+3*HOUR),H0=8,H1=21,HH=46;
  const ev=[];
  state.lessons.forEach(l=>{if(l.date>=+ws&&l.date<+we-3*HOUR)ev.push({k:l.status==='done'?'done':'sched',l,sid:l.sid,date:new Date(l.date),dur:l.dur})});
  state.students.forEach(s=>{for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(d.getDay()===s.wd){d.setHours(s.h,s.m,0,0);
    if(d>now&&!state.lessons.some(l=>l.sid===s.id&&l.status==='scheduled'&&Math.abs(l.date-d)<2*DAY))ev.push({k:'proj',sid:s.id,date:d,dur:s.dur})}}});
  const cols=[];
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const dayEv=ev.filter(e=>dayDiff(e.date,d)===0);
    const isToday=dayDiff(d,now)===0;
    cols.push(`<div class="cal-hd ${isToday?'today':''}">${L(WD_ZH[d.getDay()],WD_EN[d.getDay()])}<br><span class="num">${d.getMonth()+1}/${d.getDate()}</span></div>`);
    cols[i]=[cols[i],`<div class="cal-col" style="height:${(H1-H0)*HH}px;background:repeating-linear-gradient(to bottom,transparent 0,transparent ${HH-1}px,var(--line) ${HH-1}px,var(--line) ${HH}px)">${dayEv.map(e=>{
      const s=stu(e.sid),top=Math.max(0,((e.date.getHours()+e.date.getMinutes()/60)-H0)*HH),h=Math.max(22,e.dur/60*HH-2);
      const att=e.k==='proj'?`data-act="cal-proj" data-sid="${e.sid}" data-ts="${+e.date}"`:`data-act="cal-open" data-lid="${e.l.id}"`;
      const flag=e.k==='sched'&&!e.l.confirmedAt?` · ${L('待确认','unconfirmed')}`:e.k==='proj'?` · ${L('常规','regular')}`:'';
      return `<button class="ev ${e.k}" style="--c:${stuColor(e.sid)};top:${top}px;height:${h}px" ${att} aria-label="${esc(s.name)} ${fmtDT(e.date)}"><b>${esc(s.name.split(' ')[0])}</b> ${fmtT(e.date)}${h>36?`<br>${e.dur} ${L('分钟','min')}${flag}`:''}</button>`}).join('')}</div>`];
  }
  const times=Array.from({length:H1-H0+1},(_,i)=>`<span style="top:${i*HH}px">${pad(H0+i)}:00</span>`).join('');
  const last=new Date(ws);last.setDate(last.getDate()+6);
  return `<div class="stack"><div class="page-h"><h1>${L('日历','Calendar')}</h1><div class="cal-nav"><button class="btn sm" data-act="cal-prev" aria-label="${L('上一周','Previous week')}">‹</button><b class="num">${fmtD(ws)} – ${fmtD(last)}</b><button class="btn sm" data-act="cal-next" aria-label="${L('下一周','Next week')}">›</button><button class="btn sm" data-act="cal-today">${L('回到本周','This week')}</button></div></div>
    <div class="cal-scroll"><div class="cal"><div class="cal-hd"></div>${cols.map(c=>c[0]).join('')}
      <div class="cal-times" style="height:${(H1-H0)*HH}px;grid-column:1;grid-row:2">${times}</div>${cols.map(c=>c[1]).join('')}</div></div>
    <div class="legend">${state.students.map(s=>`<span><i style="--c:${stuColor(s.id)}"></i>${esc(s.name)}</span>`).join('')}<span>${L('实线 = 已排的课，浅色 = 上过的课，虚线 = 常规时段（点一下就能排）','Solid = scheduled, faded = past, dashed = regular slot (tap to schedule)')}</span></div>
    <p class="small muted">${L('点一节课可以改时间。保存时学生和家长会收到一条通知和更新后的日历邀请，学生需要重新确认。','Tap a lesson to change its time. The student and parent get a notice and an updated calendar invite, and the student confirms again.')}</p></div>`;
}

async function startCam(){

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('unsupported');

function toggleRec(){
  const U=state.up,btn=document.getElementById('rec-btn'),lab=document.getElementById('rec-state');
  if(!recorder){
    recChunks=[];
    try{recorder=new MediaRecorder(camStream)}catch(_){toast(L('这个浏览器不能录视频','This browser cannot record video'));return}
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
    recorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:recorder&&recorder.mimeType||'video/webm'});const secs=U.recSecs||0;
      const ext=(blob.type.includes('mp4')?'mp4':'webm');
      stopCam();
      U.file={name:L(`练习录像-${fmtT(Date.now()).replace(':','')}.${ext}`,`practice-${fmtT(Date.now()).replace(':','')}.${ext}`),size:blob.size,url:URL.createObjectURL(blob),dur:`${Math.floor(secs/60)}:${pad(secs%60)}`};
      U.step='review';drawModal();
    };
    recorder.start(1000);U.recSecs=0;
    if(btn)btn.textContent=L('停止','Stop');
    recTick=setInterval(()=>{U.recSecs++;if(lab)lab.innerHTML=`<span class="rec-dot"></span> ${L('录制中','Recording')} <span class="num">${Math.floor(U.recSecs/60)}:${pad(U.recSecs%60)}</span>`},1000);
    if(lab)lab.innerHTML=`<span class="rec-dot"></span> ${L('录制中','Recording')} <span class="num">0:00</span>`;
  }else{clearInterval(recTick);recTick=null;try{recorder.stop()}catch(_){}}
}

document.addEventListener('submit',e=>{
  e.preventDefault();
  const A=state.auth;
  if(e.target.id==='login-email-form'){
    const em=document.getElementById('login-email').value.trim().toLowerCase();A.email=em;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){A.err=L('邮箱格式不对，请再检查一下。','That email doesn\'t look right. Please check it.');render();return}
    const m=[];if(ADMIN_EMAILS.includes(em))m.push({r:'admin'});
    state.parents.filter(p=>p.email===em).forEach(p=>m.push({r:'parent',id:p.id}));
    state.students.filter(s=>s.email===em).forEach(s=>m.push({r:'student',id:s.id}));
    if(!m.length){A.err=L('这个邮箱还没有加入琴房。请确认拼写，或者请老师把它加进学生名单。','This email isn\'t in the studio yet. Check the spelling or ask the teacher to add it.');render();return}
    A.matches=m;A.code=String(Math.floor(100000+Math.random()*900000));A.err='';A.step='code';render();
    const c=document.getElementById('login-code');if(c)c.focus();return;
  }
  if(e.target.id==='login-code-form'){
    const v=document.getElementById('login-code').value.replace(/\D/g,'');
    if(v!==A.code){A.err=L('验证码不对，请再看一下邮件里的 6 位数字。','That code doesn\'t match. Check the 6 digits in the email.');render();return}
    A.err='';
    if(A.matches.length>1){A.step='pick';render();return}
    enterAs(A.matches[0]);render();toast(okToast());return;
  }
  if(e.target.id==='rec-form'){
    const sid=document.getElementById('rec-student').value;
    const date=new Date(document.getElementById('rec-date').value).getTime()||Date.now();
    const p=document.getElementById('rec-pieces').value.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]).map(x=>[x[0],x[1]||'',ST_PARSE[(x[2]||'').toLowerCase()]||'review']);
    if(!p.length){toast(L('请至少填一首曲目','Add at least one piece'));return}
    const notes={p,f:document.getElementById('rec-focus').value,t:document.getElementById('rec-tempo').value,hw:document.getElementById('rec-hw').value};
    let l=lessonsOf(sid).find(x=>x.status==='scheduled'&&Math.abs(x.date-date)<1.5*DAY);
    if(l){l.status='done';l.date=date;l.notes=notes;
      const s=stu(sid),nx=new Date(date);nx.setDate(nx.getDate()+7);nx.setHours(s.h,s.m,0,0);
      state.lessons.push({id:`${sid}-${l.n+1}-${Date.now()}`,sid,n:l.n+1,date:+nx,dur:s.dur,status:'scheduled',confirmedAt:null,signedAt:null,notes:null});
    }else{
      l={id:`${sid}-x${Date.now()}`,sid,n:doneOf(sid).length+1,date,dur:stu(sid).dur,status:'done',confirmedAt:null,signedAt:null,notes};
      state.lessons.push(l);
      state.lessons.filter(x=>x.sid===sid&&x.status==='scheduled').forEach(x=>x.n++);
    }
    const dueV=document.getElementById('rec-due').value;const due=dueV?new Date(dueV+'T20:00').getTime():date+6*DAY;
    const acc=[...document.querySelectorAll('input[name="rec-acc"]:checked')].map(x=>x.value);
    const keep=document.getElementById('rec-acc-keep').value;
    state.assigns.push({id:'a-'+l.id+Date.now(),lid:l.id,sid,title:notes.hw,piece:p[0],due,submittedAt:null,featured:p.some(x=>x[2]==='done'),video:null,
      acc,accDays:keep==='keep'?null:+keep,yt:null});
    toast(L(`已保存 ${stu(sid).name} 第 ${l.n} 节，签字请求已发出${acc.length?`，附带 ${acc.length} 首伴奏`:''}`,`Saved lesson ${l.n} for ${stu(sid).name}; sign-off request sent${acc.length?` with ${acc.length} accompaniment${acc.length>1?'s':''}`:''}`));
    state.tab='students';state.selStudent=sid;window.scrollTo(0,0);render();
  }
  if(e.target.id==='notice-form'){
    const to=document.getElementById('nt-to').value,aud=document.getElementById('nt-aud').value,title=document.getElementById('nt-title').value.trim(),body=document.getElementById('nt-body').value.trim();
    if(!title){toast(L('请写标题','Add a title'));return}
    state.notices.unshift({id:'n'+(++_nid),ts:Date.now(),to:to==='all'?{scope:'all'}:{scope:'student',sid:to},aud:to==='all'?'both':aud,title,body,read:{}});
    toast(L('通知已发出','Notice sent'));render();return;
  }
  if(e.target.id==='msg-reply-form'){
    const t=document.getElementById('msg-text').value.trim();if(!t)return;
    const sid=state.msgSel||state.students[0].id;
    state.messages.push({id:'m'+Date.now(),sid,from:'teacher',ts:Date.now(),text:t,readT:true,readU:{}});
    toast(L('已回复，学生和家长会收到提醒','Sent. The student and parent are alerted'));render();return;
  }
  if(e.target.id==='umsg-form'){
    const t=document.getElementById('umsg-text').value.trim();if(!t)return;
    state.messages.push({id:'m'+Date.now(),sid:state.sid,from:state.role,pid:state.pid,ts:Date.now(),text:t,readT:false,readU:{}});
    toast(L('已发给老师，老师会收到提醒','Sent. Your teacher will be alerted'));render();return;
  }
  if(e.target.id==='res-form'){
    const title=document.getElementById('res-title').value.trim(),f=document.getElementById('res-file').files[0];
    if(!title){toast(L('请写名称','Add a name'));return}
    const r={id:'r'+Date.now(),kind:'file',title,desc:document.getElementById('res-desc').value.trim(),mode:'students',groups:[],students:[],added:Date.now(),file:f?{name:f.name,blob:f}:{name:'file.pdf'}};
    state.resources.unshift(r);state.selRes=r.id;toast(L('已上传。现在选择哪些学生能看到。','Uploaded. Now choose who can see it.'));render();return;
  }
  if(e.target.id==='book-form'){
    const n=document.getElementById('book-name').value.trim();if(!n)return;
    const s=stu(state.selStudent);(s.books=s.books||[]).unshift({n:[n,n],s:'current'});render();return;
  }
  if(e.target.id==='rw-form'){
    const n=document.getElementById('rw-name').value.trim(),c=parseInt(document.getElementById('rw-cost').value,10)||30;if(!n)return;
    state.rewards.push({id:'w'+Date.now(),name:[n,n],cost:c,on:true});render();return;
  }
  if(e.target.id==='sch-form'){
    const sid=document.getElementById('sch-student').value;
    const d=document.getElementById('sch-date').value,t=document.getElementById('sch-time').value;
    const date=new Date(`${d}T${t}`).getTime();if(!date){toast(L('请填日期和时间','Enter a date and time'));return}
    const n=lessonsOf(sid).length+1;
    const l={id:`${sid}-s${Date.now()}`,sid,n,date,dur:+document.getElementById('sch-dur').value,status:'scheduled',confirmedAt:null,signedAt:null,notes:null};
    state.lessons.push(l);render();openModal(()=>modalRemind(l.id));
  }
});

render();
})();
</script>

</body></html>
